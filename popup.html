<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YouTube Presets</title>
  <link rel="stylesheet" href="popup.css" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-left">
      <img src="icons/icon32.png" alt="YouTube Presets" class="app-icon" />
      <h1>YouTube Presets</h1>
    </div>
    <span id="createBtnWrapper" class="icon-btn-wrapper" title="Create preset">
      <button id="createBtn" class="icon-btn" aria-label="Create preset">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
    </span>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="presets"></section>
  </main>

  <dialog id="createDialog">
    <form id="createForm">
      <h2 id="createDialogTitle">Create Preset</h2>
      <p id="createHint" class="dialog-hint" role="status" aria-live="polite"></p>

      <label>
        Name
        <input type="text" id="name" required maxlength="60" placeholder="e.g., Theater · 2× · 1080p" />
      </label>

      <label>
        Speed
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1">1.0×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2" selected>2.0×</option>
          <option value="2.5">2.5×</option>
        </select>
      </label>

      <label>
        Quality
        <select id="quality">
          <option value="max" selected>Max available</option>
          <option value="4320">4320p</option>
          <option value="2880">2880p</option>
          <option value="2160">2160p</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="240">240p</option>
          <option value="144">144p</option>
          <option value="auto">Auto</option>
        </select>
      </label>

      <label>
        View mode
        <select id="viewMode">
          <option value="default">Default</option>
          <option value="theater">Theater</option>
          <option value="fullscreen">Fullscreen</option>
          <option value="pip">Picture-in-Picture</option>
        </select>
      </label>

      <label class="row">
        <span>Captions</span>
        <select id="captions">
          <option value="off" selected>Off</option>
          <option value="on">On</option>
        </select>
      </label>

      <label>
        Volume
        <select id="volume">
          <option value="unchanged" selected>Leave unchanged</option>
          <option value="0">0%</option>
          <option value="10">10%</option>
          <option value="20">20%</option>
          <option value="30">30%</option>
          <option value="40">40%</option>
          <option value="50">50%</option>
          <option value="60">60%</option>
          <option value="70">70%</option>
          <option value="80">80%</option>
          <option value="90">90%</option>
          <option value="100">100%</option>
        </select>
      </label>

      <label>
        Sleep timer
        <select id="sleepTimer">
          <option value="off" selected>Off</option>
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="20">20 minutes</option>
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="50">50 minutes</option>
          <option value="60">60 minutes</option>
          <option value="end">End of video</option>
        </select>
      </label>

      <menu>
        <button id="cancelCreateBtn" type="button">Cancel</button>
        <button id="saveBtn" type="submit">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="deleteDialog" aria-labelledby="deleteDialogTitle">
    <form method="dialog">
      <h2 id="deleteDialogTitle">Delete preset?</h2>
      <p>“<strong id="deletePresetName"></strong>” will be permanently deleted.</p>
      <menu>
        <button value="cancel">Cancel</button>
        <button class="danger-button" value="delete">Delete</button>
      </menu>
    </form>
  </dialog>

  <script src="presetCore.js"></script>
  <script src="popup.js"></script>
</body>
</html>
